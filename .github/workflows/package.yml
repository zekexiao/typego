# 在 Windows 和 Ubuntu 上编译、跑单元测试并打安装包；推送 v* 标签时把安装包附加到同名 Release。
name: Package

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.10.3'

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # inno.iss 里写死了 C:\Qt\6.10.3\msvc2022_64，安装到同一位置。
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          dir: 'C:\'
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          cmake --build build --target check
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            foreach ($t in 'tst_file_search_command', 'tst_screenshot_store') { & "build\tests\$t.exe"; "exit=$LASTEXITCODE" }
            exit 1
          }
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc inno.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: TypeGo-windows-x64
          path: dist/*.exe
          if-no-files-found: error

  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libegl1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-render-util0 libxcb-image0

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          cmake --build build --target check
          ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package
        working-directory: build
        run: cpack -G DEB

      - uses: actions/upload-artifact@v4
        with:
          name: TypeGo-ubuntu-amd64
          path: build/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 已有同名 Release 时只追加附件，不改正文。
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
