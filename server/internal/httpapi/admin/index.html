<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TypeGo 后台</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <header>
    <div><strong>TypeGo</strong><span>版本管理后台</span></div>
    <button id="tokenButton" class="secondary">设置管理 Token</button>
  </header>

  <main>
    <section class="summary">
      <div><span>全部版本</span><strong id="total">0</strong></div>
      <div><span>已发布</span><strong id="published">0</strong></div>
      <div><span>灰度发布</span><strong id="rollout">0</strong></div>
    </section>

    <section class="panel upload-panel">
      <div class="panel-title">
        <div><span>RainS3</span><h2>上传安装包</h2></div>
        <small>API: cn-nb1.rains3.com · Public: typego.cn-nb1.rains3.com</small>
      </div>
      <div class="upload-grid">
        <label>Access Key<input id="s3AccessKey" autocomplete="off" placeholder="Access Key"></label>
        <label>Secret Key<input id="s3SecretKey" type="password" autocomplete="off" placeholder="Secret Key"></label>
        <label>Bucket<input id="s3Bucket" autocomplete="off" placeholder="Bucket 名称"></label>
        <label>对象路径<input id="s3ObjectKey" placeholder="releases/windows/TypeGo_1.1.0.exe"></label>
        <label class="wide">选择文件<input id="s3File" type="file"></label>
        <div class="wide actions"><button id="uploadButton" type="button">上传并回填下载链接</button><span id="uploadMessage"></span></div>
      </div>
    </section>

    <section class="panel editor">
      <div class="panel-title">
        <div><span>版本配置</span><h1 id="formTitle">新增版本</h1></div>
        <button id="resetButton" class="secondary">清空表单</button>
      </div>
      <form id="releaseForm">
        <input id="id" type="hidden">
        <label>平台<select id="platform" required><option value="windows">Windows</option><option value="macos">macOS</option><option value="linux">Linux</option></select></label>
        <label>架构<input id="arch" required value="amd64" placeholder="amd64 / arm64"></label>
        <label>版本号<input id="version" required placeholder="1.1.0"></label>
        <label class="wide">下载链接<input id="downloadUrl" type="url" required placeholder="https://downloads.example.com/TypeGo.exe"></label>
        <label>灰度比例<div class="range-row"><input id="rolloutPercent" type="range" min="0" max="100" value="100"><output id="rolloutOutput">100%</output></div></label>
        <div class="checks"><label><input id="publishedCheck" type="checkbox" checked> 已发布</label><label><input id="mandatory" type="checkbox"> 强制更新</label></div>
        <label class="wide">更新日志<textarea id="changelog" rows="5" placeholder="输入本版本更新内容"></textarea></label>
        <div class="wide actions"><button type="submit">保存版本</button><span id="message"></span></div>
      </form>
    </section>

    <section class="panel">
      <div class="panel-title">
        <div><span>发布记录</span><h2>版本列表</h2></div>
        <div class="filters"><select id="platformFilter"><option value="">全部平台</option><option value="windows">Windows</option><option value="macos">macOS</option><option value="linux">Linux</option></select><button id="refreshButton" class="secondary">刷新</button></div>
      </div>
      <div id="empty" class="empty">暂无版本，请先新增版本。</div>
      <div id="releaseList" class="release-list"></div>
    </section>
  </main>

  <dialog id="tokenDialog">
    <form method="dialog">
      <h2>管理 Token</h2>
      <p>Token 仅保存在当前浏览器会话中。</p>
      <input id="tokenInput" type="password" autocomplete="off" placeholder="TYPEGO_ADMIN_TOKEN">
      <div class="actions"><button value="cancel" class="secondary">取消</button><button id="saveTokenButton" value="default">保存</button></div>
    </form>
  </dialog>
  <script src="/admin/app.js" defer></script>
</body>
</html>
